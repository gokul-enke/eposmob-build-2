name: Release Linux CI

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build-and-release-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: eeezeeerp
            url: "https://eeezeeerp.cloudposai.com"
          - name: eposdemo
            url: "https://eposdemo.yougoit.in"
          - name: linetolinepos
            url: "https://linetolinepos.yougoit.in"
          - name: hypersouq
            url: "https://epos.hypersouq.in"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev

      - uses: subosito/flutter-action@v2.12.0
        with:
          flutter-version: 3.35.1
          channel: stable

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install project dependencies
        run: flutter pub get

      - name: Create .env file
        run: echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" > .env

      - name: Build Linux artifacts
        run: flutter build linux --release -v --dart-define=BASE_URL=${{ matrix.url }}

      - name: Package Linux bundle
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../cloudpos-${{ matrix.name }}-linux-${{ github.ref_name }}.tar.gz .

      - name: Verify Linux package
        run: ls -la build/linux/x64/

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          path: build/linux/x64/cloudpos-${{ matrix.name }}-linux-${{ github.ref_name }}.tar.gz
          name: cloudpos-${{ matrix.name }}-linux-${{ github.ref_name }}.tar.gz

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/linux/x64/cloudpos-${{ matrix.name }}-linux-${{ github.ref_name }}.tar.gz
          draft: true
          prerelease: true
