name: Release Linux CI
on:
  push:
    tags:
      - v*
permissions:
  contents: write
jobs:
  build-and-release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev

      - uses: subosito/flutter-action@v2.12.0
        with:
          flutter-version: 3.35.1
          channel: stable

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install project dependencies
        run: flutter pub get

      - name: Build Linux artifacts
        run: flutter build linux --release -v

      - name: Package Linux bundle
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../EposMachine-linux-${{ github.ref_name }}.tar.gz .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          path: build/linux/x64/EposMachine-linux-${{ github.ref_name }}.tar.gz
          name: EposMachine-linux-${{ github.ref_name }}.tar.gz

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/linux/x64/EposMachine-linux-${{ github.ref_name }}.tar.gz
          draft: true
          prerelease: true
          generate_release_notes: true

      - name: Upload to transfer.sh
        run: |
          curl --upload-file build/linux/x64/EposMachine-linux-${{ github.ref_name }}.tar.gz https://transfer.sh/EposMachine-linux-${{ github.ref_name }}.tar.gz
