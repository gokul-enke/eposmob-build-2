name: Release Linux CI

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build-and-release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev

      - uses: subosito/flutter-action@v2.12.0
        with:
          flutter-version: 3.35.1
          channel: stable

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install project dependencies
        run: flutter pub get

      - name: Read app version from pubspec
        id: app_version
        shell: bash
        run: |
          version="$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml | tr -d '\r')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\+[0-9]+)?$ ]]; then
            echo "Unsupported pubspec version: $version" >&2
            exit 1
          fi
          release_version="${version//+/.}"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "Release version: $release_version"

      - name: Create .env file
        run: echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" > .env

      - name: Build Linux artifacts
        run: flutter build linux --release -v --dart-define=BASE_URL=https://eeezeeerp.cloudposai.com

      - name: Package Linux bundle
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../cloudpos-${{ steps.app_version.outputs.release_version }}-linux.tar.gz .

      - name: Verify Linux package
        run: ls -la build/linux/x64/

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          path: build/linux/x64/cloudpos-${{ steps.app_version.outputs.release_version }}-linux.tar.gz
          name: cloudpos-${{ steps.app_version.outputs.release_version }}-linux.tar.gz

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/linux/x64/cloudpos-${{ steps.app_version.outputs.release_version }}-linux.tar.gz
          draft: true
          prerelease: true
