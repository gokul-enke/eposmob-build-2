name: Build MSIX for Manual Store Upload

on:
  # MSIX is a separate manual/store package and is not part of the three-file
  # APK, Windows installer, and Linux release triggered by a v* tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-msix:
    name: Build MSIX Package
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: eeezeeerp
            url: "https://eeezeeerp.cloudposai.com"
          - name: eposdemo
            url: "https://eposdemo.yougoit.in"
          - name: linetolinepos
            url: "https://linetolinepos.yougoit.in"
          - name: hypersouq
            url: "https://epos.hypersouq.in"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          flutter-version: "3.38.9"
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env file
        run: echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" > .env

      - name: Build Windows app
        run: flutter build windows --release --dart-define=BASE_URL=${{ matrix.url }}

      - name: Copy DLLs to Release Folder
        run: |
          cp dependencies/*.dll build/windows/x64/runner/Release/

      - name: Copy to MSIX expected path
        run: |
          New-Item -ItemType Directory -Force -Path "build/windows/runner/Release"
          Get-ChildItem -Path "build/windows/x64/runner/Release" | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "build/windows/runner/Release/" -Recurse -Force
          }
          Write-Host "Files copied:"
          Get-ChildItem -Path "build/windows/runner/Release" | Select-Object -First 10

      - name: Build MSIX Package
        timeout-minutes: 5
        run: dart run msix:create --build-windows false -v

      - name: Rename MSIX for environment
        run: |
          $msixFile = Get-ChildItem -Path "build/windows/runner/Release/" -Filter "*.msix" | Select-Object -First 1
          Rename-Item -Path $msixFile.FullName -NewName "cloudpos-${{ matrix.name }}.msix"

      - name: Upload MSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudpos-${{ matrix.name }}-msix
          path: build/windows/runner/Release/cloudpos-${{ matrix.name }}.msix
          retention-days: 30

      - name: Upload MSIX to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/windows/runner/Release/cloudpos-${{ matrix.name }}.msix
          draft: true
          prerelease: true
          generate_release_notes: true
