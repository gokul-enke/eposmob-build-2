name: Android Release CI
on:
  push:
    tags:
      - v*
permissions:
  contents: write
jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          generate_release_notes: true

  build-and-release-android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2.12.0
        with:
          flutter-version: 3.35.1
          channel: stable

      - name: Install project dependencies
        run: flutter pub get

      - name: Read app version from pubspec
        id: app_version
        shell: bash
        run: |
          version="$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml | tr -d '\r')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\+[0-9]+)?$ ]]; then
            echo "Unsupported pubspec version: $version" >&2
            exit 1
          fi
          release_version="${version//+/.}"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "Release version: $release_version"

      - name: Create .env file
        run: echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" > .env

      - name: Build APK
        run: flutter build apk --release -v --dart-define=BASE_URL=https://eeezeeerp.cloudposai.com

      - name: Verify APK Build
        run: ls -la build/app/outputs/flutter-apk/

      - name: Rename APK for GitHub Release
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/cloudpos-${{ steps.app_version.outputs.release_version }}.apk

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/cloudpos-${{ steps.app_version.outputs.release_version }}.apk
          draft: true
          prerelease: true