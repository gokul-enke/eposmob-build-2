name: Android Release CI
on:
  push:
    tags:
      - v*
permissions:
  contents: write
jobs:
  build-and-release-android:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: eeezeeerp
            url: "https://eeezeeerp.cloudposai.com"
            folder_id: ${{ secrets.GDRIVE_FOLDER_ID_EEEZEEERP }}
          - name: eposdemo
            url: "https://eposdemo.yougoit.in"
            folder_id: ${{ secrets.GDRIVE_FOLDER_ID_EPOSDEMO }}
          - name: linetolinepos
            url: "https://linetolinepos.yougoit.in"
            folder_id: ${{ secrets.GDRIVE_FOLDER_ID_LINETOLINEPOS }}
          - name: hypersouq
            url: "https://epos.hypersouq.in"
            folder_id: ${{ secrets.GDRIVE_FOLDER_ID_HYPERSOUQ }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2.12.0
        with:
          flutter-version: 3.35.1
          channel: stable

      - name: Install project dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release -v --dart-define=BASE_URL=${{ matrix.url }}

      - name: Verify APK Build
        run: ls -la build/app/outputs/flutter-apk/

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/cloudpos.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          path: "build/app/outputs/flutter-apk/cloudpos.apk"
          name: cloudpos-${{ matrix.name }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/cloudpos.apk
          draft: true
          prerelease: true
          generate_release_notes: true

      - name: Upload to Google Drive
        if: ${{ matrix.folder_id != '' }}
        uses: adityak74/google-drive-upload-git-action@v4.9
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          filename: build/app/outputs/flutter-apk/cloudpos.apk
          folderId: ${{ matrix.folder_id }}
          name: cloudpos.apk
          overwrite: "true"