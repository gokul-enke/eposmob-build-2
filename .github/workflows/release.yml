name: Release CI
on:
  push:
    tags:
      - v*
permissions:
  contents: write
jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          generate_release_notes: true

  build-and-release-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2.12.0
        with:
          flutter-version: 3.38.9
          channel: stable

      - name: Install project dependencies
        run: flutter pub get

      - name: Read app version from pubspec
        id: app_version
        shell: pwsh
        run: |
          $version = (Get-Content pubspec.yaml |
            Where-Object { $_ -match '^version:\s+\S+' } |
            Select-Object -First 1) -replace '^version:\s*', ''
          $version = $version.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(\+\d+)?$') {
            throw "Unsupported pubspec version: $version"
          }
          $releaseVersion = $version.Replace('+', '.')
          "release_version=$releaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release version: $releaseVersion"

      - name: Create .env file
        run: echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" > .env

      - name: Build artifacts
        run: flutter build windows --release -v --dart-define=BASE_URL=https://eeezeeerp.cloudposai.com

      - name: Copy DLLs to Release Folder
        run: |
          cp dependencies/*.dll build/windows/x64/runner/Release/

      - name: Verify Release DLLs
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          Get-ChildItem $releaseDir | Format-Table Name, Length
          $required = @(
            "cloudpos.exe",
            "flutter_windows.dll",
            "flutter_pos_printer_platform_image_3_plugin.dll",
            "msvcp140.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll"
          )
          foreach ($name in $required) {
            $path = Join-Path $releaseDir $name
            if (-not (Test-Path $path)) {
              throw "Missing required file: $path"
            }
            $info = Get-Item $path
            if ($info.Length -lt 1024) {
              throw "File looks corrupt/empty: $path ($($info.Length) bytes)"
            }
            Write-Host "OK $name ($($info.Length) bytes)"
          }
          # Fail if printer DLL is not a PE (MZ header) — catches truncated copies early
          $printerDll = Join-Path $releaseDir "flutter_pos_printer_platform_image_3_plugin.dll"
          $bytes = [System.IO.File]::ReadAllBytes($printerDll)[0..1]
          if ([char]$bytes[0] -ne 'M' -or [char]$bytes[1] -ne 'Z') {
            throw "Printer plugin DLL is not a valid PE image: $printerDll"
          }
          Write-Host "Printer plugin DLL PE header OK"

      - name: Install Inno Setup
        run: |
          choco install innosetup --yes --no-progress

      - name: Build Installer
        shell: pwsh
        run: |
          if (Test-Path Output) {
            Remove-Item Output -Recurse -Force
          }
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" `
            "/DMyAppVersion=${{ steps.app_version.outputs.release_version }}" `
            ".\inno_setup.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed"
          }

      - name: Verify installer name
        shell: pwsh
        run: |
          $expected = "Output\cloudpos-${{ steps.app_version.outputs.release_version }}.exe"
          $installers = @(Get-ChildItem -Path Output -Filter "*.exe")
          if ($installers.Count -ne 1 -or -not (Test-Path $expected)) {
            throw "Expected exactly one installer named $expected; found: $($installers.Name -join ', ')"
          }
          Write-Host "Created $expected"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: Output/cloudpos-${{ steps.app_version.outputs.release_version }}.exe
          draft: true
          prerelease: true

