name: Release CI
on:
  push:
    tags:
      - v*
permissions:
  contents: write
jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          generate_release_notes: true

  build-and-release-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2.12.0
        with:
          flutter-version: 3.38.9
          channel: stable

      - name: Install project dependencies
        run: flutter pub get

      - name: Read app version from pubspec
        id: app_version
        shell: pwsh
        run: |
          $version = (Get-Content pubspec.yaml |
            Where-Object { $_ -match '^version:\s+\S+' } |
            Select-Object -First 1) -replace '^version:\s*', ''
          $version = $version.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(\+\d+)?$') {
            throw "Unsupported pubspec version: $version"
          }
          $releaseVersion = $version.Replace('+', '.')
          "release_version=$releaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release version: $releaseVersion"

      - name: Create .env file
        run: echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" > .env

      - name: Build artifacts
        run: flutter build windows --release -v --dart-define=BASE_URL=https://eeezeeerp.cloudposai.com

      - name: Verify x64 release binaries
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          Get-ChildItem $releaseDir | Format-Table Name, Length
          $required = @(
            "cloudpos.exe",
            "flutter_windows.dll",
            "flutter_pos_printer_platform_image_3_plugin.dll"
          )
          foreach ($name in $required) {
            $path = Join-Path $releaseDir $name
            if (-not (Test-Path $path)) {
              throw "Missing required file: $path"
            }
            $info = Get-Item $path
            if ($info.Length -lt 1024) {
              throw "File looks corrupt/empty: $path ($($info.Length) bytes)"
            }
            Write-Host "OK $name ($($info.Length) bytes)"
          }
          # Every executable loaded by this x64 Flutter build must have an x64
          # PE/COFF machine header. This prevents 0xc000007b at application startup.
          $binaries = Get-ChildItem $releaseDir -Recurse -File |
            Where-Object { $_.Extension -in ".exe", ".dll" }
          foreach ($binary in $binaries) {
            $bytes = [System.IO.File]::ReadAllBytes($binary.FullName)
            if ($bytes.Length -lt 64 -or [BitConverter]::ToUInt16($bytes, 0) -ne 0x5A4D) {
              throw "Not a valid PE file: $($binary.FullName)"
            }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length -or
                [BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x00004550) {
              throw "Invalid PE header: $($binary.FullName)"
            }
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0x8664) {
              throw ("Non-x64 binary in x64 release: {0} (machine 0x{1:X4})" -f `
                $binary.FullName, $machine)
            }
            Write-Host "x64 $($binary.Name)"
          }

      - name: Download Microsoft VC++ Redistributable (x64)
        shell: pwsh
        run: |
          $assetDir = "installer-assets"
          $redistPath = Join-Path $assetDir "vc_redist.x64.exe"
          New-Item -ItemType Directory -Path $assetDir -Force | Out-Null
          Invoke-WebRequest `
            -Uri "https://aka.ms/vc14/vc_redist.x64.exe" `
            -OutFile $redistPath

          $signature = Get-AuthenticodeSignature $redistPath
          if ($signature.Status -ne "Valid" -or
              $signature.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") {
            throw "VC++ Redistributable does not have a valid Microsoft signature"
          }
          Write-Host "Downloaded signed Microsoft VC++ x64 Redistributable"

      - name: Install Inno Setup
        run: |
          choco install innosetup --yes --no-progress

      - name: Build Installer
        shell: pwsh
        run: |
          if (Test-Path Output) {
            Remove-Item Output -Recurse -Force
          }
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" `
            "/DMyAppVersion=${{ steps.app_version.outputs.release_version }}" `
            ".\inno_setup.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed"
          }

      - name: Verify installer name
        shell: pwsh
        run: |
          $expected = "Output\cloudpos-${{ steps.app_version.outputs.release_version }}.exe"
          $installers = @(Get-ChildItem -Path Output -Filter "*.exe")
          if ($installers.Count -ne 1 -or -not (Test-Path $expected)) {
            throw "Expected exactly one installer named $expected; found: $($installers.Name -join ', ')"
          }
          Write-Host "Created $expected"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: Output/cloudpos-${{ steps.app_version.outputs.release_version }}.exe
          draft: true
          prerelease: true

