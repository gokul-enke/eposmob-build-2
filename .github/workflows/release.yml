name: Release CI
on:
  push:
    tags:
      - v*
permissions:
  contents: write
jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          generate_release_notes: true

  build-and-release-windows:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: eeezeeerp
            url: "https://eeezeeerp.cloudposai.com"
          - name: eposdemo
            url: "https://eposdemo.yougoit.in"
          - name: linetolinepos
            url: "https://linetolinepos.yougoit.in"
          - name: hypersouq
            url: "https://epos.hypersouq.in"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2.12.0
        with:
          flutter-version: 3.35.1
          channel: stable

      - name: Install project dependencies
        run: flutter pub get

      - name: Build artifacts
        run: flutter build windows --release -v --dart-define=BASE_URL=${{ matrix.url }}

      - name: Copy DLLs to Release Folder
        run: |
          cp dependencies/*.dll build/windows/x64/runner/Release/

      - name: Verify Files in Release Directory
        run: dir build/windows/x64/runner/Release/

      - name: Install Inno Setup
        run: |
          choco install innosetup --yes --no-progress

      - name: Build Installer
        run: iex ("& {0} {1} {2}" -f '"C:\Program Files (x86)\Inno Setup 6\iscc.exe"',"/DMyAppVersion='${{github.ref_name}}'", ".\inno_setup.iss")

      # 1. Prepare file for Google Drive (needs to be cloudpos.exe)
      - name: Rename for Google Drive
        run: |
          Get-ChildItem -Path Output\*.exe | Rename-Item -NewName "cloudpos.exe"

      - name: Set Drive Folder ID
        run: |
          if ("${{ matrix.name }}" -eq "eeezeeerp") { echo "DRIVE_FOLDER_ID=${{ secrets.GDRIVE_FOLDER_ID_EEEZEEERP }}" >> $env:GITHUB_ENV }
          if ("${{ matrix.name }}" -eq "eposdemo") { echo "DRIVE_FOLDER_ID=${{ secrets.GDRIVE_FOLDER_ID_EPOSDEMO }}" >> $env:GITHUB_ENV }
          if ("${{ matrix.name }}" -eq "linetolinepos") { echo "DRIVE_FOLDER_ID=${{ secrets.GDRIVE_FOLDER_ID_LINETOLINEPOS }}" >> $env:GITHUB_ENV }
          if ("${{ matrix.name }}" -eq "hypersouq") { echo "DRIVE_FOLDER_ID=${{ secrets.GDRIVE_FOLDER_ID_HYPERSOUQ }}" >> $env:GITHUB_ENV }

      # Note: Uploading to Drive is moved to a separate job because the Action requires Linux (Docker).
      # Here we upload the artifact so the Linux job can pick it up.
      - name: Upload Artifact for Drive
        uses: actions/upload-artifact@v4
        with:
          name: drive-artifact-${{ matrix.name }}
          path: Output/cloudpos.exe

      # 2. Rename for GitHub Release (needs to be unique)
      - name: Rename for GitHub Release
        run: |
           Rename-Item -Path "Output/cloudpos.exe" -NewName "cloudpos-${{ matrix.name }}.exe"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: Output/cloudpos-${{ matrix.name }}.exe
          draft: true
          prerelease: true

  upload-to-drive-windows:
    needs: build-and-release-windows
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: eeezeeerp
          - name: eposdemo
          - name: linetolinepos
          - name: hypersouq
    steps:
      - name: Set Drive Folder ID
        run: |
          if [ "${{ matrix.name }}" == "eeezeeerp" ]; then echo "DRIVE_FOLDER_ID=${{ secrets.GDRIVE_FOLDER_ID_EEEZEEERP }}" >> $GITHUB_ENV; fi
          if [ "${{ matrix.name }}" == "eposdemo" ]; then echo "DRIVE_FOLDER_ID=${{ secrets.GDRIVE_FOLDER_ID_EPOSDEMO }}" >> $GITHUB_ENV; fi
          if [ "${{ matrix.name }}" == "linetolinepos" ]; then echo "DRIVE_FOLDER_ID=${{ secrets.GDRIVE_FOLDER_ID_LINETOLINEPOS }}" >> $GITHUB_ENV; fi
          if [ "${{ matrix.name }}" == "hypersouq" ]; then echo "DRIVE_FOLDER_ID=${{ secrets.GDRIVE_FOLDER_ID_HYPERSOUQ }}" >> $GITHUB_ENV; fi

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: drive-artifact-${{ matrix.name }}
          path: download

      - name: Verify Download
        run: ls -R download

      - name: Upload to Google Drive
        if: ${{ env.DRIVE_FOLDER_ID != '' }}
        uses: adityak74/google-drive-upload-git-action@main
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          filename: download/cloudpos.exe
          folderId: ${{ env.DRIVE_FOLDER_ID }}
          name: cloudpos.exe
          overwrite: "true"

