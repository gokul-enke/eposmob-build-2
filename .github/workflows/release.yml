name: Release CI
on:
  push:
    tags:
      - v*
permissions:
  contents: write
jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          generate_release_notes: true

  build-and-release-windows:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: eeezeeerp
            url: "https://eeezeeerp.cloudposai.com"
          - name: eposdemo
            url: "https://eposdemo.yougoit.in"
          - name: linetolinepos
            url: "https://linetolinepos.yougoit.in"
          - name: hypersouq
            url: "https://epos.hypersouq.in"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2.12.0
        with:
          flutter-version: 3.35.1
          channel: stable

      - name: Install project dependencies
        run: flutter pub get

      - name: Build artifacts
        run: flutter build windows --release -v --dart-define=BASE_URL=${{ matrix.url }}

      - name: Copy DLLs to Release Folder
        run: |
          cp dependencies/*.dll build/windows/x64/runner/Release/

      - name: Verify Files in Release Directory
        run: dir build/windows/x64/runner/Release/

      - name: Install Inno Setup
        run: |
          choco install innosetup --yes --no-progress

      - name: Build Installer
        run: iex ("& {0} {1} {2}" -f '"C:\Program Files (x86)\Inno Setup 6\iscc.exe"',"/DMyAppVersion='${{github.ref_name}}'", ".\inno_setup.iss")

      - name: Rename for GitHub Release
        run: |
           Rename-Item -Path "Output\*.exe" -NewName "cloudpos-${{ matrix.name }}.exe"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: Output/cloudpos-${{ matrix.name }}.exe
          draft: true
          prerelease: true

